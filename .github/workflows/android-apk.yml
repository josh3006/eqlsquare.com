name: Build Android APK

on:
  push:
    paths:
      - 'puzzle-game/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'puzzle-game/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write # needed to publish the test APK on the Releases page

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: puzzle-game
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: puzzle-game/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Check level data is up to date
        run: |
          python3 tools/build_levels_md.py
          if ! git diff --quiet -- app/js/levels-data.js LEVELS.md; then
            echo "::error::levels.json changed but generated files were not rebuilt. Run: npm run levels"
            git diff --stat -- app/js/levels-data.js LEVELS.md
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Copy game into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: puzzle-game/android
        run: ./gradlew assembleDebug --no-daemon -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/trick-mind-$VERSION_NAME-debug.apk"
          ls -la dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: trick-mind-debug-${{ env.VERSION_NAME }}
          path: puzzle-game/dist/*.apk
          if-no-files-found: error

      # Publish the latest test APK on the repository's Releases page so it can be
      # downloaded straight from a phone (artifacts are zipped and need a desktop login).
      - name: Publish test APK to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-latest "dist/trick-mind-$VERSION_NAME-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Trick Mind test build $VERSION_NAME" \
            --notes "Latest test APK from branch \`$GITHUB_REF_NAME\` (commit ${GITHUB_SHA::7}). Download the .apk on your Android phone and open it to install. Test build: purchases and ads are simulated."

      # Signed release build (APK + AAB for Google Play). Runs only when the
      # signing secrets are configured in the repository settings.
      - name: Decode signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK and AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: puzzle-game/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload release builds
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trick-mind-release-${{ env.VERSION_NAME }}
          path: |
            puzzle-game/android/app/build/outputs/apk/release/*.apk
            puzzle-game/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove signing key
        if: always() && env.HAS_KEYSTORE == 'true'
        run: rm -f "$RUNNER_TEMP/release.keystore"
