services:
  landing:
    image: ${APP_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8083}:80"
    networks:
      proxy:
        aliases:
          - eqlsquare-site
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
